<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2925"/>
      <stop offset="50%" stop-color="#123f39"/>
      <stop offset="100%" stop-color="#1a5a51"/>
    </linearGradient>
    <radialGradient id="glow1" cx="20%" cy="20%" r="60%">
      <stop offset="0%" stop-color="#2db596" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#2db596" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="80%" cy="80%" r="50%">
      <stop offset="0%" stop-color="#e8a855" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#e8a855" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- Border Frame -->
  <rect x="24" y="24" width="1152" height="582" rx="24" stroke="#2c695d" stroke-width="2" fill="none"/>

  <!-- Logo Mark -->
  <rect x="80" y="80" width="56" height="56" rx="16" fill="#1b8879"/>
  <path d="M108 92L112.5 103.5L124 108L112.5 112.5L108 124L103.5 112.5L92 108L103.5 103.5L108 92Z" fill="#e7fbdf"/>

  <!-- Brand Text -->
  <text x="152" y="118" font-family="'DM Sans', system-ui, sans-serif" font-size="34" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Civic<tspan fill="#4ee0b5">Priorities</tspan>
  </text>
  <text x="360" y="118" font-family="'DM Mono', monospace" font-size="14" fill="#91cfbf" letter-spacing="1.5">
    • EVIDENCE-GATED DECISION SUPPORT
  </text>

  <!-- Headline -->
  <text x="80" y="240" font-family="Georgia, serif" font-size="64" font-weight="600" fill="#ffffff" letter-spacing="-2">
    Make public priorities
  </text>
  <text x="80" y="315" font-family="Georgia, serif" font-size="64" font-style="italic" font-weight="600" fill="#5ee6b3" letter-spacing="-2">
    explainable and reviewable.
  </text>

  <!-- Description -->
  <text x="80" y="385" font-family="'DM Sans', system-ui, sans-serif" font-size="22" fill="#c0ded5">
    Transform multilingual citizen development requests into transparent,
  </text>
  <text x="80" y="420" font-family="'DM Sans', system-ui, sans-serif" font-size="22" fill="#c0ded5">
    audit-ready municipal rankings with zero silent biases.
  </text>

  <!-- Trust Badges -->
  <g transform="translate(80, 480)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="220" height="42" rx="21" fill="rgba(255,255,255,0.08)" stroke="#3d7d70"/>
    <text x="24" y="26" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bfe8dc">
      ✓ DPG Evidence Gated
    </text>

    <!-- Badge 2 -->
    <rect x="235" y="0" width="230" height="42" rx="21" fill="rgba(255,255,255,0.08)" stroke="#3d7d70"/>
    <text x="259" y="26" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bfe8dc">
      ✓ Human Review Required
    </text>

    <!-- Badge 3 -->
    <rect x="480" y="0" width="240" height="42" rx="21" fill="rgba(255,255,255,0.08)" stroke="#3d7d70"/>
    <text x="504" y="26" font-family="'DM Sans', system-ui, sans-serif" font-size="14" font-weight="600" fill="#bfe8dc">
      ✓ Multi-Persona Better-Auth
    </text>
  </g>

  <!-- Side Card / Shortlist Preview -->
  <g transform="translate(790, 160)">
    <rect width="330" height="360" rx="20" fill="rgba(255,255,255,0.07)" stroke="#3e8173" stroke-width="1.5"/>
    <rect x="24" y="24" width="130" height="26" rx="13" fill="#1b8879"/>
    <text x="38" y="42" font-family="'DM Mono', monospace" font-size="11" font-weight="600" fill="#ffffff">
      TOP PRIORITY
    </text>
    <text x="24" y="90" font-family="Georgia, serif" font-size="24" font-weight="600" fill="#ffffff">
      Water Network
    </text>
    <text x="24" y="118" font-family="Georgia, serif" font-size="20" font-weight="600" fill="#5ee6b3">
      Extension
    </text>

    <rect x="24" y="145" width="282" height="85" rx="12" fill="rgba(0,0,0,0.25)"/>
    <text x="40" y="175" font-family="'DM Sans', system-ui, sans-serif" font-size="12" fill="#88b5a9">
      FORMULA SCORE S
    </text>
    <text x="40" y="212" font-family="Georgia, serif" font-size="34" font-weight="700" fill="#ffffff">
      55.0 <tspan font-size="14" font-family="'DM Sans', sans-serif" fill="#5ee6b3">ELIGIBLE</tspan>
    </text>

    <text x="24" y="265" font-family="'DM Mono', monospace" font-size="12" fill="#9cd9c9">
      S = 100 × (wD + (1-w)G)
    </text>
    <text x="24" y="295" font-family="'DM Sans', system-ui, sans-serif" font-size="12" fill="#7fa89e">
      SHA-256 Audit Trail • Rev #1
    </text>
  </g>
</svg>
